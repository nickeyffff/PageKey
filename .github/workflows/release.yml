name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 编译
        run: make build

      - name: 打包 .app
        run: make app

      - name: 生成 zip
        run: |
          ditto -c -k --sequesterRsrc --keepParent .build/PageKey.app PageKey.app.zip
          ls -lh PageKey.app.zip

      - name: 生成 dmg
        run: |
          mkdir -p dmg
          cp -R .build/PageKey.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "PageKey" -srcfolder dmg -ov -format UDZO PageKey.dmg
          ls -lh PageKey.dmg

      - name: 写入发布说明
        run: |
          cat > NOTES.md <<'EOF'
          ## 安装

          **方式一（推荐，自动处理 Gatekeeper 隔离属性）**

          ```bash
          curl -fsSL https://raw.githubusercontent.com/nickeyffff/PageKey/main/install.sh | bash
          ```

          **方式二**：下载 `PageKey.app.zip` 或 `PageKey.dmg`，解压 / 挂载后把 PageKey.app 拖进「应用程序」。

          > 本包为 ad-hoc 签名且未经 Apple 公证，首次打开可能提示「无法验证开发者」或「已损坏」。
          > 处理方式任选其一：
          > - 右键点 PageKey.app → 打开 → 再点「打开」
          > - 系统设置 → 隐私与安全性 → 底部点「仍要打开」
          > - 终端执行：`xattr -dr com.apple.quarantine /Applications/PageKey.app`
          >
          > 使用方式一则可完全避免此问题。

          ## 变更

          - 右 Command → Page Up，右 Option → Page Down，仅在指定 App 前台时生效
          - 基于系统自带 hidutil，无需「辅助功能」等任何权限
          - 菜单栏状态、切换提示条、`--quiet/--reset/--list/--version`
          EOF
          cat NOTES.md

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in
            v*) ;;
            *) TAG="manual-$(date +%Y%m%d%H%M)" ;;
          esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" PageKey.app.zip PageKey.dmg install.sh --clobber
          else
            gh release create "$TAG" PageKey.app.zip PageKey.dmg install.sh \
              --title "PageKey ${TAG}" \
              --notes-file NOTES.md
          fi
