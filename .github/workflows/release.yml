name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 编译
        run: make build

      - name: 打包 .app
        run: make app

      - name: 生成 zip
        run: |
          ditto -c -k --sequesterRsrc --keepParent .build/PageKey.app PageKey.app.zip
          ls -lh PageKey.app.zip

      - name: 生成 dmg
        run: |
          mkdir -p dmg
          cp -R .build/PageKey.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "PageKey" -srcfolder dmg -ov -format UDZO PageKey.dmg
          ls -lh PageKey.dmg

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then TAG="manual-$(date +%Y%m%d%H%M)"; fi
          gh release create "$TAG" \
            PageKey.app.zip PageKey.dmg install.sh \
            --title "PageKey ${TAG}" \
            --generate-notes \
            --notes "## 安装

**方式一（推荐，会自动去掉隔离属性）**
\`\`\`bash
curl -fsSL https://raw.githubusercontent.com/nickeyffff/PageKey/main/install.sh | bash
\`\`\`

**方式二**：下载 \`PageKey.app.zip\` 或 \`PageKey.dmg\`，解压/挂载后把 PageKey.app 拖到「应用程序」。

> 本包为 ad-hoc 签名、未经 Apple 公证。若首次打开提示「无法验证开发者」或「已损坏」：
> 右键点 PageKey.app → 打开 → 再点「打开」；或在「系统设置 → 隐私与安全性」底部点「仍要打开」；
> 或终端执行 \`xattr -dr com.apple.quarantine /Applications/PageKey.app\`。
> 用方式一则完全不会有这个问题。" \
            || gh release upload "$TAG" PageKey.app.zip PageKey.dmg install.sh --clobber
